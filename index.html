<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="./style.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Fast paced games</title>
  </head>
  <body>
    <header>
      <!-- TODO: Change the title to match your theme. -->
      <!-- Example: HTML5 A/V Practice: City Vibes -->
      <h1>HTML5 A/V Practice: <span>Fast paced video games</span></h1>
    </header>

    <main>
      <!-- 
    TODO: Create TWO media cards.
    Each card should have:
    1. one video
    2. one audio clip
    3. one button that plays both together
    4. optional: one pause button or reset button
  -->

      <section class="media-card">
        <!-- MEDIA PAIR 1 -->

        <!-- 
      TODO: Replace the # in the video source with your first video file or video link.
      Make sure the type matches your file.
      Example for mp4: type="video/mp4"
    -->
        <video id="video-one" muted>
          <source src="videos/HARDRAINEXPERTNODMG.mp4" type="video/mp4" />
          Your browser does not support the video tag.
        </video>

        <!-- 
      TODO: This button should play video-one and audio-one at the same time.
      In JavaScript, save this button in a variable called button1.
    -->
        <button id="button-one">Play Pair 1</button>
        <button id="pause-one">Pause Pair 1</button>

        <!-- 
      OPTIONAL CHALLENGE:
      Add a pause button for Pair 1.
      Give it an id so you can select it in JavaScript.
    -->
        <!-- <button id="pause-one">Pause Pair 1</button> -->

        <!-- 
      TODO: Replace the # in the audio source with your first audio file or audio link.
      Make sure the type matches your file.
      Example for mp3: type="audio/mpeg"
    -->
        <audio id="audio-one">
          <source
            src="./audios/HARDRAINEXPERTNODMG.mp3.mp4"
            type="audio/mpeg"
          />
          Your browser does not support the audio tag.
        </audio>
      </section>

      <section class="media-card">
        <!-- MEDIA PAIR 2 -->

        <!-- TODO: Add your second video source. -->
        <video id="video-two">
          <source src="videos/Cloakertime.mp4" type="video/mp4" />
          Your browser does not support the video tag.
        </video>

        <!-- 
      TODO: This button should play video-two and audio-two at the same time.
      In JavaScript, save this button in a variable called button2.
    -->
        <button id="button-two">Play Pair 2</button>
        <button id="pause-two">Pause Pair 2</button>

        <!-- OPTIONAL CHALLENGE: Add a pause button for Pair 2. -->
        <!-- <button id="pause-two">Pause Pair 2</button> -->

        <!-- TODO: Add your second audio source. -->
        <audio id="audio-two">
          <source src="audios/cloakerMusic.mp4" type="audio/mpeg" />
          Your browser does not support the audio tag.
        </audio>
      </section>
    </main>

    <footer>
      <p>Created by Your Name</p>
    </footer>
    <script src="./script.js"></script>
  </body>
</html>
